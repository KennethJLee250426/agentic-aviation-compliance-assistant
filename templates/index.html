<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Compliance Agentic RAG</title>
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #0284c7; /* Professional aerospace sky blue */
            --accent-hover: #0369a1;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --warning-bg: #fffbeb;
            --warning-border: #fcd34d;
            --user-msg-bg: #0284c7;
            --bot-msg-bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Master Dashboard Frame inspired by MRO ERP layouts */
        .workspace-frame {
            width: 100%;
            max-width: 1050px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Banner Branding Header */
        .top-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
        }

        .brand-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-tagline {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .system-badge {
            font-size: 11px;
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Main Content Container */
        .content-body {
            padding: 25px 30px;
            background: #ffffff;
            position: relative;
        }

        /* Subtle Background Turbine Watermark Motif */
        .content-body::before {
            content: "";
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 350px;
            height: 350px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='100' cy='100' r='80' fill='none' stroke='%23f1f5f9' stroke-width='2' stroke-dasharray='4 4'/%3E%3Ccircle cx='100' cy='100' r='50' fill='none' stroke='%23f1f5f9' stroke-width='1.5'/%3E%3Ccircle cx='100' cy='100' r='20' fill='%23f8fafc' stroke='%23e2e8f0' stroke-width='2'/%3E%3Cpath d='M100 20 L100 180 M20 100 L180 100 M44 44 L156 156 M44 156 L156 44' stroke='%23f1f5f9' stroke-width='1'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        .controls-panel {
            display: flex;
            gap: 16px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--bg-color);
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 240px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
        }

        select, button, input[type="text"] {
            font-family: inherit;
            font-size: 14px;
        }

        select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .fast-mode-label {
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: 500;
        }

        .fast-mode-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* Preset Prompt Chips */
        .preset-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .chip {
            font-size: 12px;
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .chip:hover {
            background: #bae6fd;
            border-color: #7dd3fc;
        }

        .chat-box {
            height: 440px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
        }

        .message {
            padding: 14px 18px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 2px 5px rgba(2, 132, 199, 0.2);
        }

        .bot-msg {
            background: var(--bot-msg-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .bot-msg.needs-review {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }

        .review-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f59e0b;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-area {
            display: flex;
            gap: 12px;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }

        button#send-btn {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        button#send-btn:hover {
            background: var(--accent-hover);
        }

        button#clear-btn {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            cursor: pointer;
            padding: 12px 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }

        button#clear-btn:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        details.sources-dropdown, details.findings {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.02);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        details summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--accent);
            outline: none;
        }

        details .content-block {
            margin-top: 8px;
            padding: 8px 10px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            color: var(--text-muted);
        }

        .meta-line {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>  

<div class="workspace-frame">
    <!-- Top MRO Banner Header -->
    <div class="top-banner">
        <div class="brand-area">
            <div class="brand-title">
                ✈️ MULTI-AUTHORITY AVIATION COMPLIANCE RAG
            </div>
            <div class="brand-tagline">Propelling the Future of Aviation MRO Quality &amp; Safety</div>
        </div>
        <span class="system-badge">Open-Source Engine</span>
    </div>
    
    <div class="content-body">
        <div class="controls-panel">
            <div class="control-group">
                <label for="authority-select">Authority Filter:</label>
                <select id="authority-select">
                    <option value="ALL">ALL (EASA, CAAS, CAAC)</option>
                    <option value="EASA">EASA only</option>
                    <option value="CAAS">CAAS only</option>
                    <option value="CAAC">CAAC only</option>
                </select>
            </div>
            <label class="fast-mode-label">
                <input type="checkbox" id="fast-mode-checkbox" />
                Fast mode (skip verification)
            </label>
        </div>

        <!-- Quick Prompt Suggestions -->
        <div class="preset-chips">
            <span style="font-size: 12px; font-weight: 600; color: var(--text-muted); align-self: center;">Quick queries:</span>
            <div class="chip" onclick="setQuery('What are the EASA Part-IS security requirements?')">EASA Part-IS security</div>
            <div class="chip" onclick="setQuery('Compare quality management roles across authorities')">Role comparison</div>
            <div class="chip" onclick="setQuery('What are the CAAS continuing airworthiness standards?')">CAAS airworthiness</div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="message bot-msg">System ready. Ask any regulatory compliance question regarding EASA, CAAS, or CAAC documents[cite: 8].</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your compliance question here..." />
            <button id="clear-btn" onclick="clearChat()" title="Clear Chat History">Clear</button>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    function setQuery(text) {
        document.getElementById("user-input").value = text;
        document.getElementById("user-input").focus();
    }

    function clearChat() {
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = `<div class="message bot-msg">Chat cleared. System ready for new queries.</div>`;
    }

    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const authoritySelect = document.getElementById("authority-select");
        const fastModeCheckbox = document.getElementById("fast-mode-checkbox");
        
        const question = inputField.value.trim();
        if (!question) return;

        chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(question)}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot-msg" id="${loadingId}">Analyzing regulations locally...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/api/query", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    question: question,
                    authority: authoritySelect.value,
                    skip_verification: fastModeCheckbox.checked
                })
            });

            const data = await response.json();
            const loadingMsg = document.getElementById(loadingId);

            if (response.ok) {
                renderAnswer(loadingMsg, data);
            } else {
                loadingMsg.innerText = `Error: ${data.detail || "Failed to retrieve response"}`;
            }
        } catch (err) {
            document.getElementById(loadingId).innerText = `Network Error: Could not connect to local server.`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderAnswer(el, data) {
        if (data.needs_review) {
            el.classList.add("needs-review");
        }

        let html = "";
        if (data.needs_review) {
            html += `<div class="review-badge">⚠️ Needs human review</div>`;
        }
        html += escapeHtml(data.answer);

        if (data.sources) {
            html += `<details class="sources-dropdown"><summary>View source excerpts</summary><div class="content-block">${escapeHtml(data.sources)}</div></details>`;
        }

        if (data.authority_findings && Object.keys(data.authority_findings).length > 0) {
            html += `<details class="findings"><summary>Per-authority specialist findings</summary>`;
            for (const [authority, finding] of Object.entries(data.authority_findings)) {
                html += `<div class="content-block" style="margin-top:6px;"><strong>${escapeHtml(authority)}</strong><br>${escapeHtml(finding)}</div>`;
            }
            html += `</details>`;
        }

        const retries = data.retry_count || 0;
        const authorities = (data.relevant_authorities || []).join(", ");
        html += `<div class="meta-line"><span>Authorities checked: ${escapeHtml(authorities)}</span> · <span>Retries: ${retries}</span></div>`;

        el.innerHTML = html;
    }

    document.getElementById("user-input").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
