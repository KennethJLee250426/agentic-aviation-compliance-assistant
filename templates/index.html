<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Compliance Agentic RAG</title>
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --warning-bg: #fffbeb;
            --warning-border: #fcd34d;
            --user-msg-bg: #2563eb;
            --bot-msg-bg: #f1f5f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 24px 28px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h2 {
            color: var(--primary);
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge-system {
            font-size: 11px;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 220px;
        }

        label {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }

        select, button, input[type="text"] {
            font-family: inherit;
            font-size: 14px;
        }

        select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .fast-mode-label {
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .fast-mode-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .chat-box {
            height: 500px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            background: #ffffff;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.01);
        }

        .message {
            padding: 14px 18px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.2);
        }

        .bot-msg {
            background: var(--bot-msg-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }

        .bot-msg.needs-review {
            background: var(--warning-bg);
            border-color: var(--warning-border);
        }

        .review-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f59e0b;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-area {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }

        button#send-btn {
            background: var(--accent);
            color: white;
            border: none;
            cursor: pointer;
            padding: 0 24px;
            font-weight: 600;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button#send-btn:hover {
            background: var(--accent-hover);
        }

        button#send-btn:active {
            transform: scale(0.98);
        }

        .sources {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            white-space: pre-wrap;
        }

        details.findings {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.02);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        details.findings summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--accent);
            outline: none;
        }

        details.findings .finding-block {
            margin-top: 8px;
            padding: 8px 10px;
            background: white;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            white-space: pre-wrap;
        }

        .meta-line {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>  

<div class="container">
    <div class="header">
        <h2>✈️ Multi-Authority Aviation Compliance RAG</h2>
        <span class="badge-system">Enterprise POC</span>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label for="authority-select">Authority Filter:</label>
            <select id="authority-select">
                <option value="ALL">ALL (EASA, CAAS, CAAC)</option>
                <option value="EASA">EASA only</option>
                <option value="CAAS">CAAS only</option>
                <option value="CAAC">CAAC only</option>
            </select>
        </div>
        <label class="fast-mode-label">
            <input type="checkbox" id="fast-mode-checkbox" />
            Fast mode (skip verification)
        </label>
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot-msg">System ready. Ask any regulatory compliance question regarding EASA, CAAS, or CAAC documents.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your compliance question here..." />
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const authoritySelect = document.getElementById("authority-select");
        const fastModeCheckbox = document.getElementById("fast-mode-checkbox");
        
        const question = inputField.value.trim();
        if (!question) return;

        chatBox.innerHTML += `<div class="message user-msg">${escapeHtml(question)}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = "loading-" + Date.now();
        chatBox.innerHTML += `<div class="message bot-msg" id="${loadingId}">Analyzing regulations locally...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/api/query", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    question: question,
                    authority: authoritySelect.value,
                    skip_verification: fastModeCheckbox.checked
                })
            });

            const data = await response.json();
            const loadingMsg = document.getElementById(loadingId);

            if (response.ok) {
                renderAnswer(loadingMsg, data);
            } else {
                loadingMsg.innerText = `Error: ${data.detail || "Failed to retrieve response"}`;
            }
        } catch (err) {
            document.getElementById(loadingId).innerText = `Network Error: Could not connect to local server.`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function renderAnswer(el, data) {
        if (data.needs_review) {
            el.classList.add("needs-review");
        }

        let html = "";
        if (data.needs_review) {
            html += `<div class="review-badge">⚠️ Needs human review</div>`;
        }
        html += escapeHtml(data.answer);

        if (data.sources) {
            html += `<div class="sources"><strong>Sources:</strong><br>${escapeHtml(data.sources)}</div>`;
        }

        if (data.authority_findings && Object.keys(data.authority_findings).length > 0) {
            html += `<details class="findings"><summary>Per-authority findings</summary>`;
            for (const [authority, finding] of Object.entries(data.authority_findings)) {
                html += `<div class="finding-block"><strong>${escapeHtml(authority)}</strong><br>${escapeHtml(finding)}</div>`;
            }
            html += `</details>`;
        }

        const retries = data.retry_count || 0;
        const authorities = (data.relevant_authorities || []).join(", ");
        html += `<div class="meta-line"><span>Authorities checked: ${escapeHtml(authorities)}</span> · <span>Retries: ${retries}</span></div>`;

        el.innerHTML = html;
    }

    document.getElementById("user-input").addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    // Clean HTML escape function
    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
